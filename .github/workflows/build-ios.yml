name: Build iOS Native App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Assets
        run: npx cap sync ios

      - name: Resolve Xcode Swift Package Dependencies
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj

      - name: Build Xcode iOS App
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="" CODE_SIGN_ENTITLEMENTS=""

      - name: Create Unsigned IPA & App Package
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r SurpriseDrive-iOS-Unsigned.ipa Payload
          zip -r SurpriseDrive-iOS-AppBundle.zip App.app

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurpriseDrive-iOS-App
          path: |
            ios/App/build/Build/Products/Release-iphoneos/SurpriseDrive-iOS-Unsigned.ipa
            ios/App/build/Build/Products/Release-iphoneos/SurpriseDrive-iOS-AppBundle.zip
          retention-days: 30
