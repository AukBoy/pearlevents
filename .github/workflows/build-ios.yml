name: Build iOS Native App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor iOS Assets
        run: npx cap sync ios

      - name: Build iOS App (Unsigned Simulator / Sideload Build)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA for iPhone
        run: |
          cd ios/App/build/Build/Products/Release-iphonesimulator
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r SurpriseDrive-iOS-App.ipa Payload
          zip -r SurpriseDrive-iOS-Simulator.app.zip App.app

      - name: Upload iOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SurpriseDrive-iOS-App
          path: |
            ios/App/build/Build/Products/Release-iphonesimulator/SurpriseDrive-iOS-App.ipa
            ios/App/build/Build/Products/Release-iphonesimulator/SurpriseDrive-iOS-Simulator.app.zip
          retention-days: 30
